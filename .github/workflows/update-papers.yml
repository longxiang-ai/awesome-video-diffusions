name: Update Papers

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-papers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: 验证配置和必要文件
        run: |
          python3 scripts/validate_search_config.py
          test -f data/keywords.json
          test -f data/search_config.json || test -f data/user_config.json
          test -f README_template.md

      - name: 运行离线测试
        run: python3 -m unittest discover -s tests -v

      - name: 更新论文数据和 README
        id: update
        run: |
          python3 main.py update --report "$RUNNER_TEMP/update-report.json"
          status=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/update-report.json"))["status"])')
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: 发布更新状态
        if: always()
        env:
          REPORT_PATH: ${{ runner.temp }}/update-report.json
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT_PATH"])
          print("## Paper Update Status")
          if not report_path.exists():
              print("\nNo update report was generated.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          print(f"\n- Status: `{report['status']}`")
          print(f"- Papers: `{report['paper_count']}`")
          print(f"- Data file: `{report['data_file'] or 'none'}`")
          print(f"- Latest data date: `{report['latest_data_date'] or 'none'}`")
          print(f"- Stale days: `{report['stale_days'] if report['stale_days'] is not None else 'unknown'}`")
          print(f"- Message: {report['message']}")
          if report["status"] in {"no_results", "temporary_failure"}:
              print("\n> [!WARNING]")
              print("> Existing paper data was preserved; README and commit were skipped.")
          PY

      - name: 验证新论文数据
        if: steps.update.outputs.status == 'updated'
        env:
          REPORT_PATH: ${{ runner.temp }}/update-report.json
        run: |
          data_file=$(jq -r '.data_file // empty' "$REPORT_PATH")
          test -n "$data_file"
          test -f "$data_file"
          jq -e '
            type == "array" and length > 0 and
            all(.[];
              (.title | type == "string" and length > 0) and
              (.abstract | type == "string" and length > 0) and
              (.arxiv_url | type == "string" and length > 0) and
              (.pdf_url | type == "string" and length > 0) and
              (.published_date | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
              (.authors | type == "array" and length > 0) and
              (.categories | type == "array" and length > 0)
            )
          ' "$data_file"

      - name: 检查是否有更改
        id: verify-changed-files
        if: steps.update.outputs.status == 'updated'
        run: |
          if [ -n "$(git status --porcelain -- data README.md)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 提交更改
        if: steps.verify-changed-files.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ README.md
          git commit -m "🤖 自动更新: $(date -u +'%Y-%m-%d %H:%M UTC')"

      - name: 推送更改
        if: steps.verify-changed-files.outputs.has_changes == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
